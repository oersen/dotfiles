set-option -g prefix C-Space
unbind-key C-b
bind-key C-Space send-prefix

set-option -g default-command "$SHELL"
set-option -g default-terminal "tmux-256color"
set-option -g escape-time 0
set-option -g history-file "$XDG_STATE_HOME/tmux_history"
set-option -g history-limit 8192
set-option -g mouse on
set-option -g aggressive-resize on

set-option -g status-keys vi
set-option -g mode-keys vi

set-option -g base-index 1
set-option -g pane-base-index 1
set-option -g renumber-windows on

set-option -g set-titles on
set-option -g set-titles-string "#{pane_title}"
set-option -g automatic-rename on

set-option -g copy-mode-match-style bg=white,fg=black
set-option -g copy-mode-current-match-style bg=blue,fg=black
set-option -g copy-mode-position-style bg=white,fg=black
set-option -g copy-mode-selection-style bg=white,fg=black
set-option -g menu-selected-style bg=white,fg=black
set-option -g message-style bg=black,fg=white,fill=black
set-option -g message-command-style bg=black,fg=white,fill=black
set-option -g cursor-style block
set-option -g prompt-cursor-style blinking-block
set-option -g prompt-command-cursor-style block
set-option -g status-left ""
set-option -g status-right "[#{session_name}@#{host_short}] [%c]"
set-option -g status-right-length 60
set-option -g status-style bg=black,fg=white
set-option -g pane-active-border-style fg=white
set-option -g pane-border-style fg=black
set-option -g window-status-current-style bg=white,fg=black

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

bind-key c new-window -c "#{pane_current_path}"
bind-key b split-window -h -c "#{pane_current_path}"
bind-key v split-window -v -c "#{pane_current_path}"

bind-key r source-file "$XDG_CONFIG_HOME/tmux/tmux.conf" \; display-message "RELOADED"
